name: test
on:
  push:
  pull_request:
jobs:
  unittest:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.8", "3.12"]
        exclude:
          - os: macos-latest
            python: "3.8"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # bash on every runner: on Windows that is Git Bash, the shell Claude Code runs plugin hooks with,
      # so tests/test_runner.py drives hooks/run through its sh the way Claude Code does. On Windows it
      # also runs hooks.json's commands in pwsh and Windows PowerShell 5.1, which Claude Code uses when
      # Git Bash is not installed.
      - run: python -m unittest discover -s tests -v
        shell: bash
